<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">lifeisnearby logo</title>
  <desc id="desc">A coral location marker flowing into green leaves, paired with the lowercase lifeisnearby wordmark.</desc>

  <defs>
    <linearGradient id="coral" x1="80" y1="45" x2="235" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6b4a"/>
      <stop offset="1" stop-color="#f04f35"/>
    </linearGradient>
    <linearGradient id="leaf" x1="78" y1="205" x2="250" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#61bd43"/>
      <stop offset="1" stop-color="#3d9d35"/>
    </linearGradient>
  </defs>

  <!-- Distinctive nearby/life symbol -->
  <g id="symbol">
    <!-- Open location ring; its tapered end flows toward the sprout. -->
    <path fill="url(#coral)" d="M158 42c-67 0-121 54-121 121 0 43 22 82 59 104l43 26-23-44-1-1c-28-16-45-45-45-77 0-49 39-88 88-88s88 39 88 88c0 12-2 23-7 34l35-22c1-7 2-14 2-20 0-67-54-121-118-121Z"/>
    <circle cx="158" cy="163" r="30" fill="url(#coral)"/>

    <!-- Two leaves share a continuous stem; the right cutout hints at a lowercase n. -->
    <path fill="url(#leaf)" d="M151 286c-14-45-48-72-104-82 10 53 40 87 88 99l17 4c6 1 11-4 10-10l-11-11Zm10 26c5-58 38-97 101-119-4 54-29 91-75 110v-34c0-13 8-25 21-30-24 4-38 19-38 43v30h-9Z"/>
    <!-- Proximity node -->
    <circle cx="151" cy="326" r="18" fill="#54ad3d"/>
  </g>

  <!-- Wordmark remains live text for easy editing. -->
  <text x="305" y="230" fill="#17222c"
        font-family="Avenir Next Rounded, Nunito Sans, Arial Rounded MT Bold, Arial, sans-serif"
        font-size="139" font-weight="800" letter-spacing="-7">lifeisnearby</text>
</svg>
